[package]
name = "qomicex-downloader"
version = "0.1.0"
edition = "2021"
description = "面向 Minecraft 启动器/桌面应用的高性能 Rust 下载核心库：多段并发、动态拆分、自动重试、看门狗、断点续传"
license = "MIT"

[lib]
crate-type = ["lib", "cdylib"]

[features]
default = []
# 可选：启用 HTTP/3（QUIC）。reqwest 的 http3 为 unstable 特性，需编译时
# 额外传入 `--cfg reqwest_unstable`（见 README/项目文档）。默认关闭以保持
# 纯净跨平台构建（Android 交叉编译不引入 quinn/QUIC 重依赖）。
http3 = ["reqwest/http3"]

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3"
thiserror = "2"
rand = "0.9"
tokio-util = { version = "0.7", features = ["rt"] }
sha2 = "0.10"
jni = "0.21"
serde_json = "1"

[profile.release]
lto = true

[dev-dependencies]
sha2 = "0.10"
